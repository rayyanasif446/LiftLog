{% extends "base.html" %}

{% block content %}
<h2>Edit Session</h2>
<form action="/edit/{{ record['id'] }}" method="post">
    <label>Date:</label>
    <input type="date" name="date" value="{{ record['date'] }}">

    <label>Exercise:</label>
    <input type="text" name="exercise" value="{{ record['exercise'] }}">

    <label>Sets:</label>
    <input type="number" name="sets" value="{{ record['sets'] }}" min="1" max="20">

    <label>Reps per set:</label>
    <input type="number" name="reps" value="{{ record['reps'] }}" min="1" max="100">

    <label>Weight (kg):</label>
    <input type="number" name="weight_kg" value="{{ record['weight_kg'] }}" min="0" step="0.5">

    <input type="submit" value="Update Session">
</form>
{% endblock %}
